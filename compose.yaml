services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mesa
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesa-local-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # PostgreSQL has no published ports and only joins this internal network.
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesa"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      POSTGRES_DB: mesa
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesa-local-change-me}
      POSTGRES_HOST: db
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,192.168.88.77,192.168.88.125,100.91.22.88}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    networks:
      - default
      - database
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
networks:
  default:
  database:
    internal: true
