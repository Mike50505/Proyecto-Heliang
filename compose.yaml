services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mesa
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesa-local-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesa"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      POSTGRES_DB: mesa
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesa-local-change-me}
      POSTGRES_HOST: db
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,192.168.88.77}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
