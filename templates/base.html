{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.dataset.theme=localStorage.getItem('mesa-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');</script>
  <title>{% block title %}MESA Producción{% endblock %}</title>
  <link rel="icon" href="{% static 'logo-mesa.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/process.css' %}">
  <link rel="stylesheet" href="{% static 'css/filters.css' %}">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
  <link rel="stylesheet" href="{% static 'css/logo.css' %}">
  <link rel="stylesheet" href="{% static 'css/particles.css' %}">
  <link rel="stylesheet" href="{% static 'css/apple-design.css' %}">
  <link rel="stylesheet" href="{% static 'css/suite-controls.css' %}">
</head>
<body>
  <canvas class="particle-background" data-particle-background aria-hidden="true"></canvas>
  {% include 'includes/site_header.html' %}
  <main>{% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
  <footer>MESA <span>Control de inventario y producción</span></footer>
  <script src="{% static 'js/theme.js' %}"></script>
  <script src="{% static 'js/navigation.js' %}" defer></script>
  <script src="{% static 'js/particles.js' %}" defer></script>
  <script src="{% static 'js/glide-select.js' %}" defer></script>
  <script src="{% static 'js/jelly-controls.js' %}" defer></script>
</body>
</html>
